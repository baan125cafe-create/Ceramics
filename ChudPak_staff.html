<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชุดปัก — พนักงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1a1a; --bg: #f8f7f4; --warm: #f2ebe0;
  --accent: #1a1a1a; --accent-light: #444;
  --stone: #888; --line: #e8e6e0; --white: #ffffff;
  --green: #1d9e75; --green-light: #eaf3de;
  --red: #c0392b; --red-light: #fdf0ef;
  --shadow: 0 2px 16px rgba(0,0,0,0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; padding-bottom: 80px; }
header { background: var(--ink); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.logo { color: #fff; font-size: 18px; font-weight: 600; }
.logo span { color: #aaa; font-size: 12px; font-weight: 400; margin-left: 8px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 1.5px solid var(--line); display: flex; z-index: 100; }
.nav-btn { flex: 1; padding: 10px 4px 8px; border: none; background: none; font-family: 'Sarabun', sans-serif; font-size: 12px; color: var(--stone); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.nav-btn .icon { font-size: 22px; }
.nav-btn.active { color: var(--ink); font-weight: 600; }
main { padding: 16px; max-width: 700px; margin: 0 auto; }
.section { display: none; }
.section.active { display: block; }
.section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
/* GRID */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.card { background: var(--white); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; border: 1.5px solid transparent; transition: all 0.15s; }
.card:active { transform: scale(0.98); }
.card-img { width: 100%; aspect-ratio: 1; background: var(--warm); display: flex; align-items: center; justify-content: center; font-size: 36px; overflow: hidden; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-body { padding: 10px 12px; }
.card-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.card-price { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.stock-badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
.badge-ok { background: var(--green-light); color: var(--green); }
.badge-out { background: var(--red-light); color: var(--red); }
/* FORM */
.form-card { background: var(--white); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--stone); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; font-family: 'Sarabun', sans-serif; font-size: 15px; color: var(--ink); outline: none; background: var(--white); }
.form-input:focus { border-color: var(--ink); }
/* IMAGE */
.img-upload-wrap { display: flex; gap: 10px; margin-bottom: 14px; }
.img-preview { width: 90px; height: 90px; border-radius: 12px; background: var(--warm); display: flex; align-items: center; justify-content: center; font-size: 30px; flex-shrink: 0; overflow: hidden; border: 1.5px solid var(--line); }
.img-preview img { width: 100%; height: 100%; object-fit: cover; }
.img-btns { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.btn-img { padding: 11px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--white); font-family: 'Sarabun', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--ink); text-align: center; }
.btn-img:active { background: var(--bg); }
.upload-status { font-size: 12px; color: var(--stone); margin-top: 4px; display: none; }
.btn-primary { width: 100%; padding: 14px; background: var(--ink); color: white; border: none; border-radius: 12px; font-family: 'Sarabun', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
.btn-primary:disabled { background: var(--line); color: var(--stone); cursor: not-allowed; }
/* MODAL */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
.overlay.active { display: flex; }
.modal { background: var(--white); border-radius: 20px 20px 0 0; width: 100%; max-width: 500px; padding: 24px 20px 36px; max-height: 90vh; overflow-y: auto; }
.modal-handle { width: 40px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 20px; }
.modal-img { width: 100%; height: 180px; border-radius: 12px; background: var(--warm); display: flex; align-items: center; justify-content: center; font-size: 48px; overflow: hidden; margin-bottom: 14px; }
.modal-img img { width: 100%; height: 100%; object-fit: cover; }
.modal-name { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.modal-price { font-size: 18px; color: var(--ink); font-weight: 600; margin-bottom: 16px; }
.pay-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pay-btn { padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--white); font-family: 'Sarabun', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--stone); text-align: center; }
.pay-btn.selected { border-color: var(--ink); background: var(--ink); color: white; font-weight: 600; }
/* SEARCH */
.search-bar { width: 100%; padding: 12px 16px; border: 1.5px solid var(--line); border-radius: 12px; font-family: 'Sarabun', sans-serif; font-size: 15px; color: var(--ink); outline: none; background: var(--white); margin-bottom: 16px; }
.search-bar:focus { border-color: var(--ink); }
/* EMPTY */
.empty { text-align: center; padding: 50px 20px; color: var(--stone); }
.empty-icon { font-size: 40px; margin-bottom: 10px; }
.loading { text-align: center; padding: 50px 20px; color: var(--stone); font-size: 14px; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--ink); color: white; padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 500; z-index: 999; transition: transform 0.3s; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <div class="logo">ชุดปัก ✦ <span>พนักงาน</span></div>
</header>

<main>
  <!-- สต๊อก -->
  <div class="section active" id="tab-stock">
    <input class="search-bar" type="text" placeholder="ค้นหาสินค้า..." id="search-input" oninput="filterProducts()">
    <div id="product-container"><div class="loading"><div class="spinner"></div>กำลังโหลด...</div></div>
  </div>

  <!-- เพิ่มสินค้า -->
  <div class="section" id="tab-add">
    <div class="form-card">
      <div class="section-title">เพิ่มสินค้าใหม่</div>
      <div class="form-group">
        <label class="form-label">รูปสินค้า</label>
        <div class="img-upload-wrap">
          <div class="img-preview" id="add-preview">👗</div>
          <div class="img-btns">
            <button class="btn-img" onclick="document.getElementById('cam-input').click()">📷 ถ่ายรูป</button>
            <button class="btn-img" onclick="document.getElementById('gallery-input').click()">🖼 เลือกจากคลัง</button>
            <div class="upload-status" id="upload-status">กำลังอัปโหลด...</div>
          </div>
        </div>
        <input type="file" id="cam-input" accept="image/*" capture="environment" style="display:none" onchange="handleImageSelect(event)">
        <input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
      </div>
      <div class="form-group"><label class="form-label">ชื่อสินค้า *</label><input class="form-input" type="text" id="add-name" placeholder="เช่น ชุดปักลายดอกไม้"></div>
      <div class="form-group"><label class="form-label">ราคาขาย (฿) *</label><input class="form-input" type="number" id="add-sell" placeholder="2590"></div>
      <div class="form-group"><label class="form-label">จำนวน *</label><input class="form-input" type="number" id="add-qty" placeholder="1" min="1"></div>
      <div class="form-group"><label class="form-label">หมายเหตุ</label><input class="form-input" type="text" id="add-note" placeholder="เช่น สีฟ้า ไซส์ M"></div>
      <div class="form-group"><label class="form-label">เพิ่มโดย *</label><input class="form-input" type="text" id="add-by" placeholder="ชื่อของคุณ"></div>
      <button class="btn-primary" id="add-btn" onclick="addProduct()">+ เพิ่มสินค้า</button>
    </div>
  </div>

  <!-- บันทึกขาย -->
  <div class="section" id="tab-sale">
    <div class="section-title">เลือกสินค้าที่ขาย</div>
    <div id="sale-container"><div class="loading"><div class="spinner"></div>กำลังโหลด...</div></div>
  </div>
</main>

<div class="bottom-nav">
  <button class="nav-btn active" id="nav-stock" onclick="showTab('stock')"><span class="icon">📦</span>สต๊อก</button>
  <button class="nav-btn" id="nav-add" onclick="showTab('add')"><span class="icon">➕</span>เพิ่มสินค้า</button>
  <button class="nav-btn" id="nav-sale" onclick="showTab('sale')"><span class="icon">💰</span>บันทึกขาย</button>
</div>

<!-- Sale Modal -->
<div class="overlay" id="sale-overlay" onclick="closeSaleModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-img" id="modal-img"></div>
    <div class="modal-name" id="modal-name"></div>
    <div class="modal-price" id="modal-price"></div>
    <div class="form-group"><label class="form-label">วันที่ขาย</label><input class="form-input" type="date" id="sale-date"></div>
    <div class="form-group"><label class="form-label">ราคาที่ขาย (฿)</label><input class="form-input" type="number" id="sale-price"></div>
    <div class="form-group">
      <label class="form-label">วิธีชำระเงิน</label>
      <div class="pay-row">
        <button class="pay-btn selected" id="btn-cash" onclick="selectPay('cash')">💵 Cash</button>
        <button class="pay-btn" id="btn-card" onclick="selectPay('card')">💳 Card</button>
        <button class="pay-btn" id="btn-scan" onclick="selectPay('scan')">📲 Scan/QR</button>
        <button class="pay-btn" id="btn-alipay" onclick="selectPay('alipay')">🔵 Alipay</button>
      </div>
    </div>
    <div class="form-group"><label class="form-label">ขายโดย *</label><input class="form-input" type="text" id="sold-by" placeholder="ชื่อของคุณ"></div>
    <button class="btn-primary" id="record-btn" onclick="recordSale()">✓ ยืนยันการขาย</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzvcs422vAWz0TiiEwI0LAqYOHgwYIv_Vw62O_H8bMpwB5eJyhtjF7dIPOPXA7C-ZpL/exec';
let products = [];
let selectedProduct = null;
let selectedPay = 'cash';
let uploadedImageUrl = '';

async function api(action, data = {}) {
  if (action === 'getProducts' || action === 'getSales') {
    const res = await fetch(API_URL + '?action=' + action);
    return res.json();
  }
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, ...data }) });
  return res.json();
}

function showTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'sale') loadSaleProducts();
}

async function loadProducts() {
  try {
    const data = await api('getProducts');
    products = data.products || [];
    renderProducts(products);
  } catch(e) {
    document.getElementById('product-container').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>โหลดไม่ได้ ลองใหม่</p></div>';
  }
}

function renderProducts(list) {
  const c = document.getElementById('product-container');
  if (!list.length) { c.innerHTML = '<div class="empty"><div class="empty-icon">👗</div><p>ยังไม่มีสินค้า</p></div>'; return; }
  c.innerHTML = `<div class="grid">${list.map(p => {
    const qty = Number(p.quantity);
    const badge = qty > 0 ? `<span class="stock-badge badge-ok">เหลือ ${qty}</span>` : `<span class="stock-badge badge-out">หมดแล้ว</span>`;
    const img = p.imageUrl ? `<img src="${p.imageUrl}" onerror="this.parentElement.textContent='👗'">` : '👗';
    return `<div class="card">
      <div class="card-img">${img}</div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-price">฿${Number(p.sellPrice).toLocaleString()}</div>
        ${badge}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function filterProducts() {
  const q = document.getElementById('search-input').value.toLowerCase();
  renderProducts(products.filter(p => p.name.toLowerCase().includes(q)));
}

async function loadSaleProducts() {
  const c = document.getElementById('sale-container');
  c.innerHTML = '<div class="loading"><div class="spinner"></div>กำลังโหลด...</div>';
  try {
    const data = await api('getProducts');
    products = data.products || [];
    const available = products.filter(p => Number(p.quantity) > 0);
    if (!available.length) { c.innerHTML = '<div class="empty"><div class="empty-icon">📦</div><p>ไม่มีสินค้า</p></div>'; return; }
    c.innerHTML = `<div class="grid">${available.map(p => {
      const img = p.imageUrl ? `<img src="${p.imageUrl}" onerror="this.parentElement.textContent='👗'">` : '👗';
      return `<div class="card" onclick="openSaleModal('${p.id}')">
        <div class="card-img">${img}</div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-price">฿${Number(p.sellPrice).toLocaleString()}</div>
          <span class="stock-badge badge-ok">เหลือ ${p.quantity}</span>
        </div>
      </div>`;
    }).join('')}</div>`;
  } catch(e) { c.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>โหลดไม่ได้</p></div>'; }
}

function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    // บีบอัดรูปก่อน
    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = h * MAX / w; w = MAX; } }
      else { if (h > MAX) { w = w * MAX / h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.8);
      document.getElementById('add-preview').innerHTML = `<img src="${compressed}">`;

      const status = document.getElementById('upload-status');
      status.style.display = 'block';
      status.style.color = '';
      status.textContent = 'กำลังอัปโหลดรูป...';

      try {
        const base64Data = compressed.split(',')[1];
        const result = await api('uploadImage', {
          imageData: base64Data,
          mimeType: 'image/jpeg',
          fileName: 'product_' + Date.now() + '.jpg'
        });
        if (result.imageUrl) {
          uploadedImageUrl = result.imageUrl;
          status.textContent = '✅ อัปโหลดสำเร็จ!';
          status.style.color = '#1d9e75';
        } else {
          status.textContent = '⚠️ อัปโหลดไม่สำเร็จ';
          uploadedImageUrl = '';
        }
      } catch(err) {
        status.textContent = '⚠️ อัปโหลดไม่สำเร็จ';
        uploadedImageUrl = '';
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function addProduct() {
  const name = document.getElementById('add-name').value.trim();
  const sell = document.getElementById('add-sell').value;
  const qty = document.getElementById('add-qty').value;
  const note = document.getElementById('add-note').value.trim();
  const addedBy = document.getElementById('add-by').value.trim();
  if (!name || !sell || !qty || !addedBy) { showToast('กรุณากรอกข้อมูลให้ครบ'); return; }
  const btn = document.getElementById('add-btn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    await api('addProduct', { name, sellPrice: Number(sell), quantity: Number(qty), note, imageUrl: uploadedImageUrl, addedBy });
    showToast('✅ เพิ่มสินค้าแล้ว');
    document.getElementById('add-name').value = '';
    document.getElementById('add-sell').value = '';
    document.getElementById('add-qty').value = '';
    document.getElementById('add-note').value = '';
    document.getElementById('add-by').value = '';
    document.getElementById('add-preview').innerHTML = '👗';
    document.getElementById('upload-status').style.display = 'none';
    uploadedImageUrl = '';
    loadProducts();
  } catch(e) { showToast('เกิดข้อผิดพลาด'); }
  btn.disabled = false; btn.textContent = '+ เพิ่มสินค้า';
}

function openSaleModal(id) {
  selectedProduct = products.find(p => p.id === id);
  if (!selectedProduct) return;
  document.getElementById('modal-img').innerHTML = selectedProduct.imageUrl ? `<img src="${selectedProduct.imageUrl}">` : '👗';
  document.getElementById('modal-name').textContent = selectedProduct.name;
  document.getElementById('modal-price').textContent = '฿' + Number(selectedProduct.sellPrice).toLocaleString();
  document.getElementById('sale-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('sale-price').value = selectedProduct.sellPrice;
  selectPay('cash');
  document.getElementById('sale-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeSaleModal(e) {
  if (e && e.target !== document.getElementById('sale-overlay')) return;
  document.getElementById('sale-overlay').classList.remove('active');
  document.body.style.overflow = '';
}

function selectPay(method) {
  selectedPay = method;
  ['cash','card','scan','alipay'].forEach(m => {
    document.getElementById('btn-' + m).classList.toggle('selected', m === method);
  });
}

async function recordSale() {
  const date = document.getElementById('sale-date').value;
  const price = document.getElementById('sale-price').value;
  const soldBy = document.getElementById('sold-by').value.trim();
  if (!date || !price || !soldBy) { showToast('กรุณากรอกข้อมูลให้ครบ'); return; }
  const btn = document.getElementById('record-btn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    const newQty = Number(selectedProduct.quantity) - 1;
    await api('addSale', {
      productId: selectedProduct.id,
      productName: selectedProduct.name,
      quantity: 1,
      sellPrice: Number(price),
      total: Number(price),
      paymentMethod: selectedPay,
      saleDate: date,
      soldBy,
      newQuantity: newQty
    });
    document.getElementById('sale-overlay').classList.remove('active');
    document.body.style.overflow = '';
    document.getElementById('sold-by').value = '';
    showToast('✅ บันทึกการขายแล้ว');
    loadSaleProducts();
  } catch(e) { showToast('เกิดข้อผิดพลาด'); }
  btn.disabled = false; btn.textContent = '✓ ยืนยันการขาย';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

loadProducts();
</script>
</body>
</html>
