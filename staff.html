<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baan 125 — Staff</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1008; --cream: #faf6ef; --warm: #f2ebe0;
    --clay: #c4804a; --clay-light: #e8a878; --clay-dark: #8b4e20;
    --stone: #8a7968; --line: #ddd5c8; --white: #ffffff;
    --red: #c0392b; --green: #27ae60;
    --green-light: #eafaf1; --red-light: #fdf0ef; --yellow-light: #fef9ec;
    --shadow: 0 2px 20px rgba(26,16,8,0.08);
    --shadow-lg: 0 8px 40px rgba(26,16,8,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; padding-bottom: 80px; }

  header {
    background: var(--ink); padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'DM Serif Display', serif; color: var(--cream); font-size: 20px; }
  .logo span { color: var(--clay-light); }
  .header-sub { font-size: 11px; color: var(--stone); text-transform: uppercase; letter-spacing: 2px; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white);
    border-top: 1.5px solid var(--line);
    display: flex; z-index: 100;
  }
  .nav-btn {
    flex: 1; padding: 12px 4px 10px;
    border: none; background: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px; color: var(--stone);
    cursor: pointer; display: flex;
    flex-direction: column; align-items: center; gap: 4px;
    transition: color 0.15s;
  }
  .nav-btn .icon { font-size: 22px; }
  .nav-btn.active { color: var(--clay-dark); font-weight: 600; }

  main { padding: 20px 16px; max-width: 700px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }

  /* SEARCH */
  .search-bar {
    background: var(--white); border: 1.5px solid var(--line);
    border-radius: 12px; padding: 12px 16px; width: 100%;
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    color: var(--ink); outline: none; margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .search-bar:focus { border-color: var(--clay); }
  .search-bar::placeholder { color: var(--stone); }

  /* GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card {
    background: var(--white); border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow); cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1.5px solid transparent;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--clay-light); }
  .card.out-of-stock { opacity: 0.5; }
  .card-img {
    width: 100%; aspect-ratio: 1; background: var(--warm);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; overflow: hidden;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: 10px 12px; }
  .card-name { font-size: 12px; font-weight: 600; margin-bottom: 2px; line-height: 1.3; }
  .card-size { font-size: 11px; color: var(--stone); margin-bottom: 4px; }
  .card-price { font-size: 13px; color: var(--clay-dark); font-weight: 600; margin-bottom: 4px; }
  .stock-badge {
    display: inline-block; font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .badge-ok { background: var(--green-light); color: var(--green); }
  .badge-low { background: var(--yellow-light); color: #e67e22; }
  .badge-out { background: var(--red-light); color: var(--red); }

  /* FORM */
  .form-card { background: var(--white); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .form-card h3 { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 18px; }
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--stone); margin-bottom: 6px; }
  input[type="text"], input[type="number"], input[type="date"] {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--line);
    border-radius: 10px; font-family: 'DM Sans', sans-serif;
    font-size: 15px; color: var(--ink); background: var(--white);
    outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: var(--clay); }

  /* IMAGE UPLOAD */
  .img-upload-wrap { display: flex; gap: 10px; margin-bottom: 14px; }
  .img-preview {
    width: 100px; height: 100px; border-radius: 12px;
    background: var(--warm); display: flex; align-items: center;
    justify-content: center; font-size: 32px; flex-shrink: 0;
    overflow: hidden; border: 1.5px solid var(--line);
  }
  .img-preview img { width: 100%; height: 100%; object-fit: cover; }
  .img-btns { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .btn-cam, .btn-gallery {
    padding: 12px; border: 1.5px solid var(--line);
    border-radius: 10px; background: var(--white);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    font-weight: 500; cursor: pointer; color: var(--ink);
    text-align: center; transition: all 0.15s;
  }
  .btn-cam:hover, .btn-gallery:hover { border-color: var(--clay); background: #fdf6f0; }
  .upload-progress { font-size: 12px; color: var(--stone); margin-top: 4px; display: none; }

  .btn-primary {
    width: 100%; padding: 15px; background: var(--clay);
    color: white; border: none; border-radius: 12px;
    font-family: 'DM Sans', sans-serif; font-size: 16px;
    font-weight: 600; cursor: pointer; margin-top: 8px;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--clay-dark); }
  .btn-primary:disabled { background: var(--line); color: var(--stone); cursor: not-allowed; }

  /* PAYMENT TOGGLE */
  .payment-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pay-btn {
    padding: 12px; border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--white); font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer;
    color: var(--stone); transition: all 0.15s; text-align: center;
  }
  .pay-btn.selected { border-color: var(--clay); background: #fdf1e8; color: var(--clay-dark); font-weight: 600; }

  /* SALE MODAL */
  .overlay {
    position: fixed; inset: 0; background: rgba(26,16,8,0.5);
    z-index: 200; display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.active { display: flex; }
  @media (min-width: 600px) { .overlay { align-items: center; padding: 20px; } }
  .modal {
    background: var(--white); border-radius: 24px 24px 0 0;
    width: 100%; max-width: 480px; padding: 28px 24px 36px;
    animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto;
  }
  @media (min-width: 600px) { .modal { border-radius: 20px; } }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
  .modal-product-name { font-family: 'DM Serif Display', serif; font-size: 20px; flex: 1; margin-right: 12px; line-height: 1.2; }
  .modal-close { width: 32px; height: 32px; background: var(--warm); border: none; border-radius: 50%; font-size: 18px; cursor: pointer; color: var(--ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .modal-img { width: 100%; height: 180px; border-radius: 12px; background: var(--warm); display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 16px; overflow: hidden; }
  .modal-img img { width: 100%; height: 100%; object-fit: cover; }
  .modal-meta { display: flex; gap: 10px; margin-bottom: 16px; }
  .meta-box { flex: 1; background: var(--warm); border-radius: 10px; padding: 12px; text-align: center; }
  .meta-label { font-size: 11px; color: var(--stone); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .meta-value { font-size: 18px; font-weight: 600; color: var(--ink); }

  /* EMPTY / LOADING */
  .empty { text-align: center; padding: 50px 20px; color: var(--stone); }
  .empty-icon { font-size: 44px; margin-bottom: 10px; }
  .empty h3 { font-family: 'DM Serif Display', serif; font-size: 18px; margin-bottom: 6px; color: var(--ink); }
  .loading { text-align: center; padding: 50px 20px; color: var(--stone); font-size: 14px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--clay); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--ink); color: white; padding: 12px 24px;
    border-radius: 100px; font-size: 14px; font-weight: 500;
    z-index: 999; transition: transform 0.3s ease; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* SETUP */
  #setup-banner {
    background: var(--clay); color: white; padding: 12px 20px;
    font-size: 13px; display: none; align-items: center; gap: 8px;
  }
  #setup-banner a { color: white; font-weight: 600; cursor: pointer; text-decoration: underline; }
  .setup-modal {
    background: var(--white); border-radius: 20px;
    width: 100%; max-width: 480px; padding: 28px 24px;
    animation: slideUp 0.3s ease; margin: 20px;
  }
  .setup-modal h2 { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 8px; }
  .setup-modal p { font-size: 14px; color: var(--stone); margin-bottom: 16px; line-height: 1.5; }
  .setup-modal input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink); outline: none; margin-bottom: 12px; }
  .setup-modal input:focus { border-color: var(--clay); }
  .btn-save-url { width: 100%; padding: 14px; background: var(--ink); color: white; border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }

  /* Section title */
  .section-title { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 16px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Baan 125 <span>Hangout</span></div>
    <div class="header-sub">Staff View</div>
  </div>
</header>

<div id="setup-banner">
  ⚙️ Not connected. <a onclick="openSetup()">Set up API URL</a>
</div>

<main>
  <!-- STOCK -->
  <div class="section active" id="tab-stock">
    <input class="search-bar" type="text" placeholder="Search products..." id="search-input" oninput="filterProducts()">
    <div id="product-container">
      <div class="loading"><div class="spinner"></div>Loading products...</div>
    </div>
  </div>

  <!-- ADD PRODUCT -->
  <div class="section" id="tab-add">
    <div class="form-card">
      <h3>Add New Product</h3>

      <label>Product Photo</label>
      <div class="img-upload-wrap">
        <div class="img-preview" id="add-preview">🏺</div>
        <div class="img-btns">
          <button class="btn-cam" onclick="document.getElementById('cam-input').click()">📷 Take Photo</button>
          <button class="btn-gallery" onclick="document.getElementById('gallery-input').click()">🖼 Choose from Gallery</button>
          <div class="upload-progress" id="upload-progress">Uploading image...</div>
        </div>
      </div>
      <input type="file" id="cam-input" accept="image/*" capture="environment" style="display:none" onchange="handleImageSelect(event)">
      <input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleImageSelect(event)">

      <div class="form-group">
        <label>Product Name *</label>
        <input type="text" id="add-name" placeholder="e.g. Ceramic Mug — Lotus">
      </div>
      <div class="form-group">
        <label>Size</label>
        <input type="text" id="add-size" placeholder="e.g. 300ml, Large, Small">
      </div>
      <div class="form-group">
        <label>Sell Price (฿) *</label>
        <input type="number" id="add-sell" placeholder="450" min="0">
      </div>
      <div class="form-group">
        <label>Quantity *</label>
        <input type="number" id="add-qty" placeholder="10" min="0">
      </div>
      <div class="form-group">
        <label>Added by *</label>
        <input type="text" id="add-by" placeholder="Your name">
      </div>

      <button class="btn-primary" id="add-btn" onclick="addProduct()">Add Product</button>
    </div>
  </div>

  <!-- RECORD SALE -->
  <div class="section" id="tab-sale">
    <div class="section-title">Record Sale</div>
    <div id="sale-product-container">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
  </div>
</main>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-stock" onclick="showTab('stock')">
    <span class="icon">🏺</span>Stock
  </button>
  <button class="nav-btn" id="nav-add" onclick="showTab('add')">
    <span class="icon">➕</span>Add
  </button>
  <button class="nav-btn" id="nav-sale" onclick="showTab('sale')">
    <span class="icon">💰</span>Sale
  </button>
</div>

<!-- Sale Detail Modal -->
<div class="overlay" id="sale-overlay" onclick="closeSaleModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-product-name" id="modal-name">Product</div>
      <button class="modal-close" onclick="closeSaleModal()">✕</button>
    </div>
    <div class="modal-img" id="modal-img"></div>
    <div class="modal-meta">
      <div class="meta-box">
        <div class="meta-label">Sell Price</div>
        <div class="meta-value" id="modal-price">—</div>
      </div>
      <div class="meta-box">
        <div class="meta-label">In Stock</div>
        <div class="meta-value" id="modal-stock">—</div>
      </div>
    </div>
    <div class="form-group">
      <label>Quantity Sold</label>
      <input type="number" id="qty-input" min="1" value="1">
    </div>
    <div class="form-group">
      <label>Sale Date</label>
      <input type="date" id="date-input">
    </div>
    <div class="form-group">
      <label>Payment Method</label>
      <div class="payment-toggle">
        <button class="pay-btn selected" id="btn-cash" onclick="selectPayment('cash')">💵 Cash</button>
        <button class="pay-btn" id="btn-credit" onclick="selectPayment('credit')">💳 Credit</button>
      </div>
    </div>
    <div class="form-group">
      <label>Sold by *</label>
      <input type="text" id="sold-by" placeholder="Your name">
    </div>
    <button class="btn-primary" id="record-btn" onclick="recordSale()">Record Sale</button>
  </div>
</div>

<!-- Setup Modal -->
<div class="overlay" id="setup-overlay">
  <div class="setup-modal">
    <h2>Connect Google Sheets</h2>
    <p>Paste the Web App URL from Google Apps Script to connect stock data.</p>
    <input type="text" id="api-url-input" placeholder="https://script.google.com/macros/s/...">
    <button class="btn-save-url" onclick="saveApiUrl()">Save & Connect</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_KEY = 'baan125_api_url';
let products = [];
let selectedProduct = null;
let selectedPayment = 'cash';
let uploadedImageUrl = '';

function getApiUrl() { return localStorage.getItem(API_KEY); }

async function apiCall(action, data = {}) {
  const url = getApiUrl();
  if (!url) throw new Error('No API URL');
  const res = await fetch(url, {
    method: 'POST',
    body: JSON.stringify({ action, ...data })
  });
  return res.json();
}

function showTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'sale') loadSaleProducts();
}

async function loadProducts() {
  const container = document.getElementById('product-container');
  const url = getApiUrl();
  if (!url) {
    document.getElementById('setup-banner').style.display = 'flex';
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔌</div><h3>Not Connected</h3><p>Tap the banner above to connect.</p></div>`;
    return;
  }
  try {
    const data = await apiCall('getProducts');
    products = data.products || [];
    renderProducts(products);
  } catch(e) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>Connection Error</h3><p>Check API URL in settings.</p></div>`;
  }
}

function renderProducts(list) {
  const container = document.getElementById('product-container');
  if (!list.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🏺</div><h3>No Products Yet</h3><p>Tap Add to add the first product.</p></div>`;
    return;
  }
  container.innerHTML = `<div class="grid">${list.map(p => {
    const qty = Number(p.quantity);
    let badgeClass = 'badge-ok', badgeText = `${qty} left`;
    if (qty === 0) { badgeClass = 'badge-out'; badgeText = 'Out of stock'; }
    const imgHtml = p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}" onerror="this.parentElement.textContent='🏺'">` : '🏺';
    return `<div class="card ${qty === 0 ? 'out-of-stock' : ''}">
      <div class="card-img">${imgHtml}</div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        ${p.size ? `<div class="card-size">${p.size}</div>` : ''}
        <div class="card-price">฿${Number(p.sellPrice).toLocaleString()}</div>
        <span class="stock-badge ${badgeClass}">${badgeText}</span>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function filterProducts() {
  const q = document.getElementById('search-input').value.toLowerCase();
  renderProducts(products.filter(p => p.name.toLowerCase().includes(q)));
}

async function loadSaleProducts() {
  const container = document.getElementById('sale-product-container');
  container.innerHTML = `<div class="loading"><div class="spinner"></div>Loading...</div>`;
  try {
    const data = await apiCall('getProducts');
    products = data.products || [];
    const available = products.filter(p => Number(p.quantity) > 0);
    if (!available.length) {
      container.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><h3>No Stock Available</h3></div>`;
      return;
    }
    container.innerHTML = `<div class="grid">${available.map(p => {
      const qty = Number(p.quantity);
      let badgeClass = 'badge-ok';
      let badgeText = `${qty} left`;
      const imgHtml = p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}" onerror="this.parentElement.textContent='🏺'">` : '🏺';
      return `<div class="card" onclick="openSaleModal('${p.id}')">
        <div class="card-img">${imgHtml}</div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          ${p.size ? `<div class="card-size">${p.size}</div>` : ''}
          <div class="card-price">฿${Number(p.sellPrice).toLocaleString()}</div>
          <span class="stock-badge ${badgeClass}">${badgeText}</span>
        </div>
      </div>`;
    }).join('')}</div>`;
  } catch(e) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>Error Loading</h3></div>`;
  }
}

// Image handling
function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const base64Full = ev.target.result;
    const preview = document.getElementById('add-preview');
    preview.innerHTML = `<img src="${base64Full}">`;

    // Upload to Google Drive via GAS
    const progress = document.getElementById('upload-progress');
    progress.style.display = 'block';
    progress.textContent = 'Uploading image...';

    try {
      const base64Data = base64Full.split(',')[1];
      const mimeType = file.type;
      const fileName = 'product_' + Date.now() + '.' + file.name.split('.').pop();
      const result = await apiCall('uploadImage', { imageData: base64Data, mimeType, fileName });
      if (result.imageUrl) {
        uploadedImageUrl = result.imageUrl;
        progress.textContent = '✅ Image uploaded!';
        progress.style.color = 'var(--green)';
      } else {
        progress.textContent = '⚠️ Upload failed. Product will be saved without image.';
        uploadedImageUrl = '';
      }
    } catch(err) {
      progress.textContent = '⚠️ Upload failed.';
      uploadedImageUrl = '';
    }
  };
  reader.readAsDataURL(file);
}

async function addProduct() {
  const name = document.getElementById('add-name').value.trim();
  const size = document.getElementById('add-size').value.trim();
  const sell = document.getElementById('add-sell').value;
  const qty = document.getElementById('add-qty').value;
  const addedBy = document.getElementById('add-by').value.trim();

  if (!name || !sell || !qty || !addedBy) { showToast('Fill in all fields including your name'); return; }

  const btn = document.getElementById('add-btn');
  btn.disabled = true; btn.textContent = 'Adding...';

  try {
    await apiCall('addProduct', {
      name, size,
      sellPrice: Number(sell),
      costPrice: 0,
      quantity: Number(qty),
      imageUrl: uploadedImageUrl,
      addedBy
    });
    showToast('✅ Product added!');
    // Reset
    document.getElementById('add-name').value = '';
    document.getElementById('add-size').value = '';
    document.getElementById('add-sell').value = '';
    document.getElementById('add-qty').value = '';
    document.getElementById('add-by').value = '';
    document.getElementById('add-preview').innerHTML = '🏺';
    document.getElementById('upload-progress').style.display = 'none';
    uploadedImageUrl = '';
  } catch(e) {
    showToast('Error adding product');
  }

  btn.disabled = false; btn.textContent = 'Add Product';
}

function openSaleModal(id) {
  selectedProduct = products.find(p => p.id === id);
  if (!selectedProduct) return;
  document.getElementById('modal-name').textContent = selectedProduct.name;
  document.getElementById('modal-price').textContent = '฿' + Number(selectedProduct.sellPrice).toLocaleString();
  document.getElementById('modal-stock').textContent = selectedProduct.quantity;
  const imgEl = document.getElementById('modal-img');
  imgEl.innerHTML = selectedProduct.imageUrl ? `<img src="${selectedProduct.imageUrl}" alt="${selectedProduct.name}" onerror="this.parentElement.textContent='🏺'">` : '🏺';
  document.getElementById('date-input').value = new Date().toISOString().split('T')[0];
  document.getElementById('qty-input').value = 1;
  document.getElementById('qty-input').max = selectedProduct.quantity;
  selectPayment('cash');
  document.getElementById('sale-overlay').classList.add('active');
}

function closeSaleModal(e) {
  if (e && e.target !== document.getElementById('sale-overlay')) return;
  document.getElementById('sale-overlay').classList.remove('active');
  selectedProduct = null;
}

function selectPayment(method) {
  selectedPayment = method;
  document.getElementById('btn-cash').classList.toggle('selected', method === 'cash');
  document.getElementById('btn-credit').classList.toggle('selected', method === 'credit');
}

async function recordSale() {
  const qty = parseInt(document.getElementById('qty-input').value);
  const date = document.getElementById('date-input').value;
  const soldBy = document.getElementById('sold-by').value.trim();
  if (!qty || qty < 1) { showToast('Enter a valid quantity'); return; }
  if (qty > Number(selectedProduct.quantity)) { showToast('Not enough stock'); return; }
  if (!date) { showToast('Select a sale date'); return; }
  if (!soldBy) { showToast('Enter your name'); return; }

  const btn = document.getElementById('record-btn');
  btn.disabled = true; btn.textContent = 'Recording...';

  try {
    const newQty = Number(selectedProduct.quantity) - qty;
    await apiCall('addSale', {
      productId: selectedProduct.id,
      productName: selectedProduct.name,
      quantity: qty,
      sellPrice: selectedProduct.sellPrice,
      total: qty * Number(selectedProduct.sellPrice),
      paymentMethod: selectedPayment,
      saleDate: date,
      soldBy,
      newQuantity: newQty
    });
    document.getElementById('sale-overlay').classList.remove('active');
    document.getElementById('sold-by').value = '';
    showToast('✅ Sale recorded!');
    loadSaleProducts();
  } catch(e) {
    showToast('Error recording sale');
  }

  btn.disabled = false; btn.textContent = 'Record Sale';
}

function openSetup() {
  document.getElementById('api-url-input').value = getApiUrl() || '';
  document.getElementById('setup-overlay').classList.add('active');
}

function saveApiUrl() {
  const url = document.getElementById('api-url-input').value.trim();
  if (!url) return;
  localStorage.setItem(API_KEY, url);
  document.getElementById('setup-overlay').classList.remove('active');
  document.getElementById('setup-banner').style.display = 'none';
  showToast('Connected!');
  loadProducts();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

loadProducts();
</script>
</body>
</html>
